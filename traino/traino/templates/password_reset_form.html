{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9z R6 - Nueva Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/styles_gamers.css' %}">
</head>
<body class="bg-bunker d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container" style="max-width: 460px;">
        <div class="card card-bunker p-4">
            <h2 class="text-center mb-2 fw-bold font-urbanist text-white" style="letter-spacing: 1px;">TRAINO<span style="color: #ff0055;">.GG</span></h2>
            
            <div class="divider-bunker mb-4">
                <span>NUEVA CONTRASEÑA</span>
            </div>

            {% if validlink %}
                
                {% if error %}
                    <div class="alert alert-danger text-center py-2 mb-4" style="background: rgba(255,0,0,0.1); border: 1px solid #ff0055; color: #fff;">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label label-gamer">Nueva contraseña</label>
                        <div class="input-password-wrapper">
                            <input type="password" name="new_password" id="newPassword" class="form-control input-bunker" placeholder="••••••••" required minlength="4">
                            <button type="button" class="btn-eye-toggle" onclick="togglePassword('newPassword', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <small class="text-white-50 mt-1 d-block" style="font-size: 0.75rem;">Debe tener un mínimo de 4 caracteres.</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label label-gamer">Repetir contraseña</label>
                        <div class="input-password-wrapper">
                            <input type="password" name="confirm_password" id="confirmPassword" class="form-control input-bunker" placeholder="••••••••" required minlength="4">
                            <button type="button" class="btn-eye-toggle" onclick="togglePassword('confirmPassword', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-9z-neon w-100">
                        Confirmar Nueva Contraseña
                    </button>
                </form>
            {% else %}
                <div class="alert alert-danger text-center py-3 mb-4" style="background: rgba(255,0,0,0.1); border: 1px solid #ff0055; color: #fff;">
                    El enlace de recuperación es inválido o ya caducó.
                </div>
                <a href="{% url 'reset_password' %}" class="btn btn-9z-neon w-100">
                    Solicitar nuevo enlace
                </a>
            {% endif %}
        </div>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
