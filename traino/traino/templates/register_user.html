{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9z R6 - Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/styles_gamers.css' %}">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-bunker d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 460px;">
        <div class="card card-bunker p-4">
            <h2 class="text-center mb-2 fw-bold font-urbanist text-white" style="letter-spacing: 1px;">TRAINO<span style="color: #ff0055;">.GG</span></h2>
            
            {% if mensaje_error %}
                <div class="alert alert-bunker text-center py-2 mb-4" role="alert">
                    {{ mensaje_error }}
                </div>
            {% endif %}

            <!-- Sistema Real de Login Google -->
            <div id="g_id_onload"
                data-client_id="238189205547-irh68sqouu752u27uea1v47m5dg3uvpr.apps.googleusercontent.com" 
                data-context="signup"
                data-ux_mode="popup"
                data-login_uri="http://localhost:8000/google-login/"
                data-auto_prompt="false">
            </div>
            <div class="d-flex justify-content-center mb-4">
                <div class="g_id_signin"
                    data-type="standard"
                    data-shape="rectangular"
                    data-theme="outline"
                    data-text="signup_with"
                    data-size="large"
                    data-logo_alignment="left">
                </div>
            </div>

            <!-- Separador -->
            <div class="divider-bunker mb-4">
                <span>O CREÁ TU CUENTA </span>
            </div>

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label label-gamer">Nombre Completo</label>
                    <input type="text" name="name" class="form-control input-bunker" placeholder="Ej: Fernando Fernandez" required autocomplete="off">
                </div>

                <div class="mb-3">
                    <label class="form-label label-gamer">Correo Electrónico (Obligatorio)</label>
                    <input type="email" name="email" class="form-control input-bunker" placeholder="tu@correo.com" required autocomplete="email">
                </div>

                <div class="mb-3">
                    <label class="form-label label-gamer">Nickname / Tag R6</label>
                    <input type="text" name="nickname" class="form-control input-bunker" placeholder="Ej: playerfer" required autocomplete="off">
                </div>

                <div class="mb-3">
                    <label class="form-label label-gamer">Contraseña de Acceso</label>
                    <div class="input-password-wrapper">
                        <input type="password" name="password" id="registerPassword" class="form-control input-bunker" placeholder="••••••••" required>
                        <button type="button" class="btn-eye-toggle" onclick="togglePassword('registerPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label label-gamer">Rol de Operaciones</label>
                    <select name="role_type" class="form-select select-bunker" required>
                        <option value="player" selected>Jugador Profesional (Player)</option>
                        <option value="coach">Estratega / Director Técnico (Coach)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-9z-neon w-100 mb-3">
                    Dar de Alta en Servidor
                </button>
                
                <div class="text-center mt-3">
                    <small style="color: #64748b;">¿Ya tenés una cuenta activada? <a href="{% url 'login' %}" style="color: #ff0055; font-weight: 600; text-decoration: none; margin-left: 4px;">Iniciá sesión acá</a></small>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // mostrar/ocultar contraseña
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
