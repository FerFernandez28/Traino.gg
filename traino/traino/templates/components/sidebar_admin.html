<!-- Btn hambur -->
<div class="d-md-none position-fixed top-0 start-0 m-3" style="z-index: 1040;">
    <button class="btn btn-dark border-secondary text-white shadow" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarAdminMenu" aria-controls="sidebarAdminMenu">
        <i class="bi bi-list fs-4"></i>
    </button>
</div>

<nav id="sidebarAdminMenu" class="offcanvas-md offcanvas-start bg-dark text-white border-end border-secondary" tabindex="-1" style="width: 260px; background-color: #0b1329 !important;">
    <div class="offcanvas-header border-bottom border-secondary">
        <a class="sidebar-brand text-white fw-bold text-decoration-none fs-5" href="#">TRAINO<span style="color: #ff0055;">.ADMIN</span></a>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebarAdminMenu" aria-label="Close"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column justify-content-between p-3" style="height: 100vh;">
        <div>
            <a class="sidebar-brand d-none d-md-block mb-4 text-white fw-bold text-decoration-none fs-4" href="#">TRAINO<span style="color: #ff0055;">.ADMIN</span></a>
            
            <ul class="sidebar-menu list-unstyled p-0 m-0">
                <li class="mb-2">
                    <div id="btn-show-users" class="sidebar-link active" data-bs-dismiss="offcanvas" data-bs-target="#sidebarAdminMenu">
                        <i class="bi bi-people-fill"></i> Control de Usuarios
                    </div>
                </li>
                <li class="mb-2">
                    <div id="btn-show-teams" class="sidebar-link" data-bs-dismiss="offcanvas" data-bs-target="#sidebarAdminMenu">
                        <i class="bi bi-shield-lock-fill"></i> Liga Global 2026
                    </div>
                </li>
            </ul>
        </div>

        <div class="sidebar-footer border-top border-secondary pt-3">
            {% if usuario %}
            <div class="sidebar-user-card d-flex align-items-center gap-2 mb-3 p-2 rounded" style="background-color: rgba(255,255,255,0.03);">
                <div class="user-avatar-mini rounded-circle d-flex align-items-center justify-content-center text-white fw-bold" style="background: linear-gradient(135deg, #ff0055, #f59e0b); width: 36px; height: 36px; font-size: 0.8rem; flex-shrink: 0;">AD</div>
                <div class="overflow-hidden">
                    <h6 class="text-white mb-0 text-truncate" style="font-size: 0.85rem;">{{ usuario.username }}</h6>
                    <small class="text-warning text-uppercase" style="font-size: 0.65rem;">{{ usuario.role_type }}</small>
                </div>
            </div>
            {% endif %}
            <a href="{% url 'login' %}" class="btn btn-outline-danger w-100 btn-sm font-urbanist fw-bold py-2">
                <i class="bi bi-box-arrow-left me-1"></i> Cerrar Sesión
            </a>
        </div>
    </div>
</nav>
