{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9z R6 - Recuperar Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles_gamers.css' %}">
</head>
<body class="bg-bunker d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container" style="max-width: 460px;">
        <div class="card card-bunker p-4">
            <h2 class="text-center mb-2 fw-bold font-urbanist text-white" style="letter-spacing: 1px;">TRAINO<span style="color: #ff0055;">.GG</span></h2>
            
            <div class="divider-bunker mb-4">
                <span>RECUPERAR CONTRASEÑA</span>
            </div>

            <p class="text-white-50 mb-4" style="font-size: 0.9rem;">
                Ingresá tu correo electrónico y te enviaremos un enlace para cambiar tu contraseña de acceso.
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label label-gamer">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control input-bunker" placeholder="traino@gmail.com" required>
                </div>

                <button type="submit" class="btn btn-9z-neon w-100 mb-3">
                    Solicitar Enlace de Recuperación
                </button>
                
                <div class="text-center mt-3">
                    <small style="color: #64748b;">¿Te acordaste la contraseña? <a href="{% url 'login' %}" style="color: #ff0055; font-weight: 600; text-decoration: none; margin-left: 4px;">Volver al Login</a></small>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
